<svg xmlns="http://www.w3.org/2000/svg" width="760" height="514" viewBox="0 0 760 514" role="img" aria-labelledby="title desc">
<title id="title">Time per operation: Python vs Rust</title>
<desc id="desc">Median time per operation for each case on a logarithmic scale, Python in blue and Rust in orange. Lower is better.</desc>

<style>
  .surface { fill: #fcfcfb; }
  .t1 { fill: #0b0b0b; } .t2 { fill: #52514e; } .mut { fill: #898781; }
  .grid { stroke: #e1e0d9; stroke-width: 1; }
  .link { stroke: #c9c8c1; stroke-width: 2; }
  .py { fill: #2a78d6; } .rs { fill: #eb6834; }
  .ring { stroke: #fcfcfb; stroke-width: 2; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1a1a19; }
    .t1 { fill: #f0efec; } .t2 { fill: #c3c2b7; }
    .grid { stroke: #2c2c2a; }
    .link { stroke: #4a4a46; }
    .py { fill: #3987e5; } .rs { fill: #d95926; }
    .ring { stroke: #1a1a19; }
  }
  text { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
</style>

<rect class="surface" width="760" height="514" rx="8"/>
<text class="t1" x="20" y="30" font-size="16" font-weight="600">Time per operation</text>
<text class="t2" x="20" y="50" font-size="12">Median, log scale · lower is better · each step on the axis is 10×</text>
<circle class="py" cx="26" cy="68" r="5"/>
<text class="t2" x="36" y="72" font-size="12">Python</text>
<circle class="rs" cx="96" cy="68" r="5"/>
<text class="t2" x="106" y="72" font-size="12">Rust</text>
<line class="grid" x1="170.0" y1="78" x2="170.0" y2="474"/>
<text class="mut" x="170.0" y="492" font-size="11" text-anchor="middle">10 ns</text>
<line class="grid" x1="263.3" y1="78" x2="263.3" y2="474"/>
<text class="mut" x="263.3" y="492" font-size="11" text-anchor="middle">100 ns</text>
<line class="grid" x1="356.7" y1="78" x2="356.7" y2="474"/>
<text class="mut" x="356.7" y="492" font-size="11" text-anchor="middle">1 µs</text>
<line class="grid" x1="450.0" y1="78" x2="450.0" y2="474"/>
<text class="mut" x="450.0" y="492" font-size="11" text-anchor="middle">10 µs</text>
